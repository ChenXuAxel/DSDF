[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dsdf-fusion"
version = "0.1.0"
description = "PyTorch implementation of DSDF for remote sensing spatiotemporal fusion with disentangled alignment and scale-specific representations."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Chen Xu"}, {name = "Xiaoping Du"},
  {name = "Hongdeng Jian"}, {name = "Xiangtao Fan"},
]
keywords = ["remote sensing", "spatiotemporal fusion", "reflectance", "pytorch"]
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
dependencies = [
  "torch==2.5.1",
  "einops==0.8.1",
  "triton==3.1.0",
  "causal-conv1d==1.6.0",
  "mamba-ssm==2.2.6.post3",
]

[project.urls]
Repository = "https://github.com/ChenXuAxel/DSDF"
Issues = "https://github.com/ChenXuAxel/DSDF/issues"

[project.optional-dependencies]
geotiff = ["numpy>=1.24,<3", "rasterio==1.4.3"]

[tool.setuptools]
packages = ["dsdf"]
